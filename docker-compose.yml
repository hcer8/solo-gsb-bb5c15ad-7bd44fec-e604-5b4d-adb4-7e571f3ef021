services:
  story-auditor:
    build: .
    image: branching-story-auditor:latest
    container_name: branching-story-auditor
    ports:
      - "3000:3000"
    environment:
      # 应用监听端口（容器内）
      PORT: "3000"
      # 首次启动且数据目录为空时，自动播种示例剧情；设为 false 可关闭
      SEED_ON_START: "true"
    volumes:
      # 剧情 JSON 持久化到宿主机，容器重建不丢数据
      - story-data:/app/data
    restart: unless-stopped
    healthcheck:
      # 容器内 Node 探针（healthcheck.js）：固定走 127.0.0.1，避免 localhost 解析到
      # ::1 而应用只监听 IPv4 0.0.0.0 时被误判 unhealthy；仅当 /api/stories 在超时内
      # 返回 2xx 且响应为 JSON 数组时才算健康。
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  story-data:
